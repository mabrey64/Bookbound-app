<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'Details | ' + ${book.title}">Book Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1E3] min-h-screen py-12">
  <div class="max-w-3xl mx-auto bg-[#FFF] p-8 rounded-lg shadow-lg">
    <!-- Cover + Info -->
    <div class="flex space-x-6 mb-8">
      <div class="w-32 h-40 bg-gray-200 rounded"></div>
      <div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2" th:text="${book.title}">The Great Adventure</h2>
        <p class="text-gray-600 mb-1" th:text="${book.author}">John Smith</p>
        <p class="text-gray-500 mb-4" th:text="${book.genre}">Fiction</p>
        <p class="text-gray-700 mb-6" th:text="${book.description}">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit...
        </p>
        <div class="flex space-x-4">
          <a th:href="@{/library/add(bookId=${book.id})}"
             class="px-6 py-2 bg-blue-600 text-white rounded-full hover:bg-blue-500 transition">
            Add to Library
          </a>
          <a th:href="@{/book/{id}/read(id=${book.id})}"
             class="px-6 py-2 bg-blue-600 text-white rounded-full hover:bg-blue-500 transition">
            Read Now
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
