<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Error - BookBound</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1E3] min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md p-6">
    <h1 class="text-2xl font-bold text-gray-800 mb-4">Error</h1>
    
    <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
      <span th:text="${error}">Error message</span>
    </div>
    
    <a href="/" class="text-blue-600 hover:underline">Back to Home</a>
  </div>
</body>
</html>
