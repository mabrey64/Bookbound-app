<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'BookBound | ' + ${tpl == 'landing' ? 'Welcome' : tpl == 'home' ? 'Home' : tpl == 'library' ? 'Library' : tpl == 'search' ? 'Search' : 'Page'}">BookBound</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1E3] min-h-screen flex">
  <!-- Sidebar -->
  <aside class="w-64 bg-[#EDE9E5] p-6">
    <div class="flex items-center mb-8 space-x-2">
      <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M4 19.5a9 9 0 0116 0M4 4l8 6 8-6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      </svg>
      <span class="text-2xl font-bold text-gray-800">BookBound</span>
    </div>
    <nav class="space-y-4">
      <a th:href="@{/home}" class="block text-gray-800 hover:underline">Home</a>
      <a th:href="@{/library}" class="block text-gray-800 font-semibold hover:underline">My Books</a>
      <a th:href="@{/categories}" class="block text-gray-800 hover:underline">Categories</a>
      <a th:href="@{/settings}" class="block text-gray-800 hover:underline">Settings</a>
      <a th:href="@{/logout}" class="block text-gray-800 hover:underline">Logout</a>
    </nav>
  </aside>

  <!-- Main area -->
  <div class="flex-1 flex flex-col">
    <!-- Header with back arrow + search -->
    <header class="flex items-center p-6 space-x-4">
      <a th:href="@{/home}" class="text-gray-800 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </a>
      <form th:action="@{/search}" method="get" class="flex-1">
        <input
          name="q"
          type="text"
          placeholder="Search"
          class="w-full px-4 py-2 border-2 border-gray-800 rounded-full focus:outline-none focus:ring-2 focus:ring-gray-800"
        />
      </form>
    </header>

    <!-- Library & Categories -->
    <main class="flex-1 p-8">
      <!-- My Library -->
      <h1 class="text-3xl font-bold text-gray-800 mb-6">My Library</h1>
      <div class="grid grid-cols-4 gap-6 mb-12">
        <!-- Display sample books -->
        <div th:each="book : ${books}" class="bg-white rounded-lg p-4 shadow hover:shadow-lg transition-shadow">
          <div class="h-32 bg-gray-200 rounded mb-3 flex items-center justify-center overflow-hidden relative">
            <img th:if="${book.imageUrl != null}" th:src="${book.imageUrl}" th:alt="${book.title}" 
                 class="w-full h-full object-cover transition-opacity duration-300"
                 onload="this.style.opacity='1'; this.nextElementSibling.style.display='none';"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                 style="opacity: 0;">
            <div th:if="${book.imageUrl == null}" class="flex items-center justify-center w-full h-full">
              <span class="text-gray-500 text-4xl">📚</span>
            </div>
          </div>
          <h3 class="font-semibold text-sm text-gray-800 mb-1" th:text="${book.title}">Book Title</h3>
          <p class="text-xs text-gray-600 mb-2" th:text="${book.author}">Author</p>
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs text-gray-500" th:text="${book.genre}">Genre</span>
            <span class="text-xs text-gray-500" th:text="${book.totalPages + ' pages'}">Pages</span>
          </div>
          <div class="flex space-x-2">
            <button class="text-xs bg-blue-500 text-white px-2 py-1 rounded hover:bg-blue-600">Read</button>
            <button class="text-xs bg-gray-500 text-white px-2 py-1 rounded hover:bg-gray-600">Details</button>
          </div>
        </div>
      </div>

      <!-- Browse Categories -->
      <section class="mb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Browse Categories</h2>
        <div class="flex flex-wrap gap-2">
          <!-- Display actual genres as clickable links -->
          <a th:each="genre : ${genres}" th:href="@{/search(genre=${genre})}" 
             class="px-3 py-1 bg-[#EDE9E5] text-gray-800 rounded-full text-sm hover:bg-gray-300 transition-colors" 
             th:text="${genre}">Genre</a>
        </div>
      </section>

      <!-- Placeholders under categories -->
      <div class="grid grid-cols-4 gap-6">
        <!-- Display more sample books -->
        <div th:each="book : ${books}" class="bg-white rounded-lg p-4 shadow">
          <div class="h-24 bg-gray-200 rounded mb-2 flex items-center justify-center">
            <span class="text-gray-500 text-sm">📖</span>
          </div>
          <h3 class="font-semibold text-xs text-gray-800 mb-1" th:text="${book.title}">Book Title</h3>
          <p class="text-xs text-gray-600" th:text="${book.author}">Author</p>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
