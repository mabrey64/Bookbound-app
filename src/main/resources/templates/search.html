<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Search - BookBound</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1E3] min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Search Books</h1>
    
    <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
      <span th:text="${error}">Error message</span>
    </div>
    
    <div th:if="${success}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
      <span th:text="${success}">Success message</span>
    </div>
    
    <p class="text-gray-600 mb-4">Search functionality is working!</p>
    
    <div class="mb-4">
      <p>Query: <span th:text="${searchQuery}">None</span></p>
      <p>Books count: <span th:text="${books.size()}">0</span></p>
      <p>Genres count: <span th:text="${genres.size()}">0</span></p>
      <p>Authors count: <span th:text="${authors.size()}">0</span></p>
    </div>
    
    <div class="mt-8">
      <a href="/" class="text-blue-600 hover:underline">Back to Home</a>
    </div>
  </div>
</body>
</html>
