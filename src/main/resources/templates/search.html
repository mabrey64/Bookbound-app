<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'BookBound | ' + '${tpl=='landing'?'Welcome':tpl=='home'?'Home':tpl=='library'?'Library':tpl=='search'?'Search':'Page'}'">BookBound</title>
  <!-- enable class-based dark mode -->
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/dark-mode.js"></script>
</head>
<body class="bg-[#F7F1E3] dark:bg-black text-gray-800 dark:text-gray-200 min-h-screen transition-colors duration-300">
  <!-- Top bar -->
  <header class="flex items-center justify-between p-6 bg-transparent dark:bg-transparent">
    <div class="flex items-center space-x-4">
      <!-- Dark mode button -->
      <button onclick="toggleDarkMode()" 
              class="text-2xl focus:outline-none">
        🌙
      </button>
      <!-- (optional) your back arrow / logo here -->
      <svg class="w-6 h-6 text-gray-800 dark:text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M4 19.5a9 9 0 0116 0M4 4l8 6 8-6" 
              stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      </svg>
      <span class="text-2xl font-bold">BookBound</span>
    </div>
    <!-- (optional) search bar or nav toggles -->
  </header>

  <!-- Sidebar -->
  <aside class="w-64 bg-[#EDE9E5] dark:bg-gray-800 p-6 transition-colors duration-300">
    <nav class="space-y-4">
      <a th:href="@{/home}"      class="block hover:underline">Home</a>
      <a th:href="@{/library}"   class="block hover:underline">My Books</a>
      <a th:href="@{/categories}"class="block hover:underline">Categories</a>
      <a th:href="@{/settings}"  class="block hover:underline">Settings</a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 p-8">
    <!-- Paste your page-specific markup here -->
    <div>CONTENT FOR $tpl</div>
  </main>
</body>
</html>
