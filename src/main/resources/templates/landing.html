<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>BookBound</title>
  <!-- Tailwind Play CDN for quick styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1E3] min-h-screen flex flex-col justify-center items-center">

<!-- App Title -->
<h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-6">BookBound</h1>

<!-- Sign Up / Sign In buttons -->
<div class="flex space-x-4 mb-6">
  <a th:href="@{/signup}"
     class="px-6 py-2 border-2 border-gray-800 rounded-full font-medium hover:bg-gray-800 hover:text-white transition">
    Sign Up
  </a>
  <a th:href="@{/login}"
     class="px-6 py-2 border-2 border-gray-800 rounded-full font-medium hover:bg-gray-800 hover:text-white transition">
    Sign In
  </a>
</div>

<!-- Tagline -->
<p class="text-gray-700 text-center mb-6">
  Track your reads.<br>
  Discover your next book.
</p>

<!-- Search bar -->
<form th:action="@{/search}" method="get" class="w-full max-w-md">
  <input
          type="text"
          name="q"
          placeholder="Title, author, or genre"
          class="w-full px-4 py-2 border-2 border-gray-800 rounded-full focus:outline-none focus:ring-2 focus:ring-gray-800"
  />
</form>

</body>
</html>
