<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Settings | BookBound</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .theme-transition { transition: background-color 0.3s, color 0.3s; }
  </style>
</head>
<body id="pageBody" class="bg-[#F7F1E3] text-gray-800 min-h-screen flex theme-transition">
  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 bg-[#EDE9E5] p-6 theme-transition">
    <div class="flex items-center mb-8 space-x-2">
      <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M4 19.5a9 9 0 0116 0M4 4l8 6 8-6"
              stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
      </svg>
      <span class="text-2xl font-bold">BookBound</span>
    </div>
    <nav class="space-y-4">
      <a th:href="@{/home}" class="block hover:underline">Home</a>
      <a th:href="@{/library}" class="block hover:underline">My Books</a>
      <a th:href="@{/categories}" class="block hover:underline">Categories</a>
      <a th:href="@{/settings}" class="block font-semibold hover:underline">Settings</a>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="flex-1 p-8">
    <h1 class="text-3xl font-bold mb-8">Settings</h1>

    <!-- Profile Section -->
    <section class="mb-8">
      <h2 class="text-xl font-semibold mb-4">Profile</h2>
      <div class="flex items-center space-x-6">
        <div class="w-20 h-20 bg-gray-200 rounded-full"></div>
        <button class="px-4 py-2 border-2 border-gray-800 rounded-full hover:bg-gray-100">Change Photo</button>
      </div>
      <div class="mt-4 space-y-4">
        <div>
          <label class="block mb-1">Username</label>
          <input type="text" value="John Doe"
                 class="w-1/2 px-4 py-2 border-2 border-gray-800 rounded-full bg-white focus:outline-none"/>
        </div>
        <div>
          <label class="block mb-1">Email</label>
          <input type="email" value="john@example.com"
                 class="w-1/2 px-4 py-2 border-2 border-gray-800 rounded-full bg-white focus:outline-none"/>
        </div>
      </div>
    </section>

    <!-- Preferences Section -->
    <section class="mb-8">
      <h2 class="text-xl font-semibold mb-4">Preferences</h2>
      <div class="space-y-4">
        <!-- Dark Mode Toggle -->
        <div class="flex items-center justify-between w-1/2">
          <span>Dark Mode</span>
          <button id="themeToggle" aria-label="Toggle Dark Mode"
                  class="relative inline-flex items-center h-6 w-12 bg-gray-300 rounded-full focus:outline-none theme-transition">
            <span id="toggleThumb"
                  class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full flex items-center justify-center theme-transition">
              <!-- default icon placeholder -->
            </span>
          </button>
        </div>
        <!-- Email Notifications -->
        <div class="flex items-center justify-between w-1/2">
          <span>Email Notifications</span>
          <input type="checkbox" class="h-5 w-5"/>
        </div>
      </div>
    </section>

    <!-- Account Section -->
    <section class="mb-8">
      <h2 class="text-xl font-semibold mb-4">Account</h2>
      <button class="block w-1/3 py-2 bg-gray-800 text-white rounded-full mb-2 hover:bg-gray-700">Change Password</button>
      <button class="block w-1/3 py-2 bg-red-600 text-white rounded-full hover:bg-red-500">Delete Account</button>
    </section>

    <!-- Data & Privacy Section -->
    <section>
      <h2 class="text-xl font-semibold mb-4">Data & Privacy</h2>
      <button class="block w-1/3 py-2 border-2 border-gray-800 rounded-full mb-2 hover:bg-gray-100">Export My Data</button>
      <button class="block w-1/3 py-2 border-2 border-gray-800 rounded-full hover:bg-gray-100">Clear My Library</button>
    </section>
  </main>

  <script>
    const btn = document.getElementById('themeToggle');
    const thumb = document.getElementById('toggleThumb');
    const body = document.getElementById('pageBody');
    const sidebar = document.getElementById('sidebar');
    let dark = false;

    // SVG icons
    const sun = '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-yellow-500" viewBox="0 0 20 20" fill="currentColor"><path d="M10 5a1 1 0 100-2 1 1 0 000 2zM10 17a1 1 0 100-2 1 1 0 000 2zM5 10a1 1 0 100-2 1 1 0 000 2zM17 10a1 1 0 100-2 1 1 0 000 2zM4.22 4.22a1 1 0 10-1.44-1.44 1 1 0 001.44 1.44zM16.78 16.78a1 1 0 10-1.44-1.44 1 1 0 001.44 1.44zM4.22 15.78a1 1 0 10-1.44 1.44 1 1 0 001.44-1.44zM16.78 5.22a1 1 0 10-1.44 1.44 1 1 0 001.44-1.44zM10 13a3 3 0 100-6 3 3 0 000 6z"/></svg>';
    const moon = '<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-gray-800" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293a8 8 0 11-10.586-10.586 8 8 0 0010.586 10.586z"/></svg>';

    // initialize thumb
    thumb.innerHTML = sun;

    btn.addEventListener('click', () => {
      dark = !dark;
      if (dark) {
        body.style.backgroundColor = 'black';
        body.style.color = '#e2e8f0'; /* gray-200 */
        sidebar.style.backgroundColor = '#2d3748'; /* gray-800 */
        thumb.style.transform = 'translateX(1.5rem)';
        thumb.innerHTML = moon;
      } else {
        body.style.backgroundColor = '#F7F1E3';
        body.style.color = '#1f2937'; /* gray-800 */
        sidebar.style.backgroundColor = '#EDE9E5';
        thumb.style.transform = 'translateX(0)';
        thumb.innerHTML = sun;
      }
    });
  </script>
</body>
</html>
