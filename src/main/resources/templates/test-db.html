<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Database Test - BookBound</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1E3] min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Database Test</h1>
    
    <div th:if="${success}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
      <span th:text="${success}">Success message</span>
    </div>
    
    <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
      <span th:text="${error}">Error message</span>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Database Statistics</h2>
        <p class="text-gray-600 mb-2">Total Books: <span class="font-semibold" th:text="${totalBooks}">0</span></p>
        <p class="text-gray-600 mb-2">Total Genres: <span class="font-semibold" th:text="${genres.size()}">0</span></p>
        <p class="text-gray-600 mb-2">Total Authors: <span class="font-semibold" th:text="${authors.size()}">0</span></p>
      </div>
      
      <div class="bg-white p-6 rounded-lg shadow">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Available Genres</h2>
        <div class="flex flex-wrap gap-2">
          <span th:each="genre : ${genres}" class="px-3 py-1 bg-gray-200 text-gray-800 rounded-full text-sm" th:text="${genre}">Genre</span>
        </div>
      </div>
    </div>
    
    <div th:if="${sampleBook != null}" class="mt-6 bg-white p-6 rounded-lg shadow">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Sample Book</h2>
      <p class="text-gray-600 mb-2">Title: <span class="font-semibold" th:text="${sampleBook.title}">Title</span></p>
      <p class="text-gray-600 mb-2">Author: <span class="font-semibold" th:text="${sampleBook.author}">Author</span></p>
      <p class="text-gray-600 mb-2">Genre: <span class="font-semibold" th:text="${sampleBook.genre}">Genre</span></p>
      <p class="text-gray-600 mb-2">Pages: <span class="font-semibold" th:text="${sampleBook.totalPages}">Pages</span></p>
      <p class="text-gray-600 mb-2">Image URL: <span class="font-semibold text-sm break-all" th:text="${sampleBook.imageUrl}">URL</span></p>
    </div>
    
    <div class="mt-8 space-x-4">
      <a href="/" class="text-blue-600 hover:underline">Back to Home</a>
      <a href="/search" class="text-blue-600 hover:underline">Test Search</a>
      <a href="/test-google-books" class="text-blue-600 hover:underline">Test Google Books API</a>
    </div>
  </div>
</body>
</html>
