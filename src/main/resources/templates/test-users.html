<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Test Users - BookBound</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1E3] min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Test Users</h1>
    
    <div class="mb-4">
      <p class="text-lg">Total users: <span th:text="${userCount}">0</span></p>
    </div>
    
    <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
      <span th:text="${error}">Error message</span>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div th:each="user : ${users}" class="bg-white p-4 rounded-lg shadow">
        <h3 class="font-semibold text-lg" th:text="${user.name}">User Name</h3>
        <p class="text-gray-600" th:text="${user.email}">user@email.com</p>
        <p class="text-sm text-gray-500" th:text="'ID: ' + ${user.id}">ID: xxx</p>
        <p class="text-sm text-gray-500" th:text="'Password: ' + ${user.password}">Password: xxx</p>
      </div>
    </div>
    
    <div class="mt-8">
      <a href="/" class="text-blue-600 hover:underline">Back to Home</a>
    </div>
  </div>
</body>
</html>
