<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Google Books API Test - BookBound</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1E3] min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Google Books API Test</h1>
    
    <div th:if="${success}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
      <span th:text="${success}">Success message</span>
    </div>
    
    <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
      <span th:text="${error}">Error message</span>
    </div>
    
    <div th:if="${testUrl != null}" class="mb-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Test Result</h2>
      <p class="text-gray-600 mb-2">Cover URL for "Dune" by Frank Herbert:</p>
      <p class="text-sm text-gray-500 break-all" th:text="${testUrl}">URL</p>
      
      <div class="mt-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-2">Image Preview:</h3>
        <div class="w-48 h-64 bg-gray-200 rounded overflow-hidden">
          <img th:src="${testUrl}" alt="Dune cover" class="w-full h-full object-cover"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="hidden w-full h-full flex items-center justify-center">
            <span class="text-gray-500 text-2xl">❌</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="mt-8">
      <a href="/" class="text-blue-600 hover:underline">Back to Home</a>
    </div>
  </div>
</body>
</html>
