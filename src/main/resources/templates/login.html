<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'BookBound | ' + ${tpl == 'landing' ? 'Welcome' : tpl == 'home' ? 'Home' : tpl == 'library' ? 'Library' : tpl == 'search' ? 'Search' : 'Page'}">BookBound</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F7F1E3] min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm p-6">
    <h2 class="text-3xl font-bold text-gray-800 mb-6">Sign In</h2>
    
    <!-- Success Message -->
    <div th:if="${success}" class="mb-4 p-3 bg-green-100 border border-green-400 text-green-700 rounded">
      <span th:text="${success}">Success message</span>
    </div>
    
    <!-- Error Message -->
    <div th:if="${error}" class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded">
      <span th:text="${error}">Error message</span>
    </div>
    
    <form th:action="@{/login}" method="post" class="space-y-4">
      <div>
        <label class="block text-gray-700 mb-1">Email</label>
        <input
          type="email"
          name="email"
          required
          class="w-full px-4 py-2 border-2 border-gray-800 rounded-full focus:outline-none focus:ring-2 focus:ring-gray-800"
        />
      </div>
      <div>
        <label class="block text-gray-700 mb-1">Password</label>
        <input
          type="password"
          name="password"
          required
          class="w-full px-4 py-2 border-2 border-gray-800 rounded-full focus:outline-none focus:ring-2 focus:ring-gray-800"
        />
      </div>
      <button
        type="submit"
        class="w-full py-2 mt-4 bg-gray-800 text-white font-medium rounded-full hover:bg-gray-700 transition"
      >
        Sign In
      </button>
    </form>
    <p class="text-center text-gray-700 mt-4">
      Don't have an account?
      <a th:href="@{/signup}" class="text-gray-800 font-semibold hover:underline">Sign Up</a>
    </p>
  </div>
</body>
</html>
