# Application Name
spring.application.name=Bookbound-app

# =============================
# H2 Database Configuration (Development)
# =============================
spring.datasource.url=jdbc:h2:mem:bookbounddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging) - http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================
# JPA/Hibernate Configuration
# =============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================
# Server Configuration
# =============================
server.port=8081

# =============================
# PostgreSQL Configuration (Production - Commented Out)
# =============================
# spring.datasource.url=jdbc:postgresql://localhost:5432/bookbounddb
